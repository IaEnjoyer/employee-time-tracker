<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generación de Informes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title mb-0">Generación de Informes</h3>
                    </div>
                    <div class="card-body">
                        <!-- Formulario para informe personal -->
                        <div class="mb-4">
                            <h4>Informe Personal</h4>
                            <form th:action="@{/reports/personal/generate}" method="get" class="needs-validation" novalidate>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="personalStartDate" class="form-label">Fecha Inicio</label>
                                        <input type="datetime-local" class="form-control flatpickr" 
                                               id="personalStartDate" name="startDate" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="personalEndDate" class="form-label">Fecha Fin</label>
                                        <input type="datetime-local" class="form-control flatpickr" 
                                               id="personalEndDate" name="endDate" required>
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <button type="submit" class="btn btn-primary">
                                        Generar Informe Personal PDF
                                    </button>
                                </div>
                            </form>
                        </div>

                        <!-- Formulario para informe oficial (solo admin) -->
                        <div sec:authorize="hasRole('ADMIN')">
                            <h4>Informe Oficial</h4>
                            <form th:action="@{/reports/official/generate}" method="get" class="needs-validation" novalidate>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="officialStartDate" class="form-label">Fecha Inicio</label>
                                        <input type="datetime-local" class="form-control flatpickr" 
                                               id="officialStartDate" name="startDate" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="officialEndDate" class="form-label">Fecha Fin</label>
                                        <input type="datetime-local" class="form-control flatpickr" 
                                               id="officialEndDate" name="endDate" required>
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <button type="submit" class="btn btn-primary">
                                        Generar Informe Oficial PDF
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar Flatpickr en todos los inputs datetime-local
            flatpickr(".flatpickr", {
                enableTime: true,
                dateFormat: "Y-m-d'T'H:i",
                time_24hr: true,
                locale: "es"
            });

            // Validación de formularios
            const forms = document.querySelectorAll('.needs-validation');
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                });
            });
        });
    </script>
</body>
</html>
