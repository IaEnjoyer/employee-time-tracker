<!-- Fragmento reutilizable -->
<div th:fragment="status-card">
    <div class="card status-card">
        <div class="card-body">
            <h5 class="card-title">Registro de Tiempo</h5>

            <!-- Mensaje dinámico -->
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <span th:text="${successMessage}">Éxito</span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <span th:text="${errorMessage}">Error</span>
            </div>

            <!-- Estado actual -->
            <div th:if="${activeRecord == null}" class="text-center py-4">
                <p class="mb-4 text-muted">No has registrado entrada hoy</p>
                <button id="checkInBtn" class="btn btn-primary btn-lg">
                    <i class="fas fa-clock"></i> Registrar Entrada
                </button>
            </div>

            <div th:if="${activeRecord != null}" class="text-center py-4">
                <p class="mb-4">
                    Entrada registrada:
                    <span class="badge bg-success" th:text="${#temporals.format(activeRecord.startTime, 'HH:mm:ss')}">09:00:00</span>
                </p>
                <button id="checkOutBtn" class="btn btn-danger btn-lg">
                    <i class="fas fa-clock"></i> Registrar Salida
                </button>
            </div>
        </div>
    </div>
</div>
