<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head>
    <title>Dashboard - Empleado</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h4 class="card-title">Estado Actual</h4>
                        <div th:if="${activeRecord}">
                            <p class="text-success">
                                <i class="fas fa-clock"></i>
                                Entrada registrada: <span th:text="${#temporals.format(activeRecord.startTime, 'HH:mm:ss')}">00:00:00</span>
                            </p>
                            <form th:action="@{/check-out}" method="POST">
                                <button type="submit" class="btn btn-danger w-100">
                                    <i class="fas fa-sign-out-alt"></i> Registrar Salida
                                </button>
                            </form>
                        </div>
                        <div th:unless="${activeRecord}">
                            <p class="text-muted">No hay registro activo</p>
                            <form th:action="@{/check-in}" method="POST">
                                <button type="submit" class="btn btn-success w-100">
                                    <i class="fas fa-sign-in-alt"></i> Registrar Entrada
                                </button>
                            </form>
                        </div>
                        <div class="mt-3">
                            <a th:href="@{/reports/personal}" class="btn btn-info w-100">
                                <i class="fas fa-file-alt"></i> Mi Informe Personal
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Últimos Registros -->
                <div class="card shadow mt-4">
                    <div class="card-body">
                        <h4 class="card-title">Últimos Registros</h4>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Entrada</th>
                                        <th>Salida</th>
                                        <th>Total</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="record : ${recentRecords}">
                                        <td th:text="${#temporals.format(record.startTime, 'dd/MM/yyyy')}">01/01/2025</td>
                                        <td th:text="${#temporals.format(record.startTime, 'HH:mm')}">09:00</td>
                                        <td th:text="${record.endTime != null ? #temporals.format(record.endTime, 'HH:mm') : '-'}">18:00</td>
                                        <td th:text="${record.endTime != null ? #temporals.format(java.time.Duration.between(record.startTime, record.endTime).toHours() + ':' + (java.time.Duration.between(record.startTime, record.endTime).toMinutes() % 60)) : '-'}">9:00</td>
                                        <td>
                                            <span th:class="${record.status.name() == 'APPROVED' ? 'badge bg-success' : (record.status.name() == 'REJECTED' ? 'badge bg-danger' : 'badge bg-warning')}"
                                                  th:text="${record.status}">PENDING</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
