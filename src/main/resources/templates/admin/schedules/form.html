<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Gestión de Horarios</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">
                <span th:text="${schedule.id == null ? 'Nuevo' : 'Editar'} + ' Horario'">Nuevo/Editar Horario</span>
            </h1>
            
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Detalles del Horario</h6>
                </div>
                <div class="card-body">
                    <form th:action="@{${schedule.id == null ? '/admin/schedules' : '/admin/schedules/' + schedule.id}}" 
                          th:object="${schedule}" 
                          method="post">
                        <input type="hidden" th:if="${schedule.id != null}" name="_method" value="PUT">
                        
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="name">Nombre</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="department">Departamento</label>
                                <select class="form-control" id="department" th:field="*{department}" required>
                                    <option th:each="user : ${users}" 
                                            th:value="${user.department}" 
                                            th:text="${user.department}">Departamento</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="startTime">Hora de Entrada</label>
                                <input type="time" class="form-control" id="startTime" th:field="*{startTime}" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="endTime">Hora de Salida</label>
                                <input type="time" class="form-control" id="endTime" th:field="*{endTime}" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Días Laborables</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="monday" th:field="*{monday}">
                                <label class="form-check-label" for="monday">Lunes</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="tuesday" th:field="*{tuesday}">
                                <label class="form-check-label" for="tuesday">Martes</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="wednesday" th:field="*{wednesday}">
                                <label class="form-check-label" for="wednesday">Miércoles</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="thursday" th:field="*{thursday}">
                                <label class="form-check-label" for="thursday">Jueves</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="friday" th:field="*{friday}">
                                <label class="form-check-label" for="friday">Viernes</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="saturday" th:field="*{saturday}">
                                <label class="form-check-label" for="saturday">Sábado</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="sunday" th:field="*{sunday}">
                                <label class="form-check-label" for="sunday">Domingo</label>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="type">Tipo de Horario</label>
                            <select class="form-control" id="type" th:field="*{type}" required>
                                <option value="FLEXIBLE">Flexible</option>
                                <option value="FIXED">Fijo</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                                <label class="form-check-label" for="active">Activo</label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            <span th:text="${schedule.id == null ? 'Crear' : 'Actualizar'} + ' Horario'">Crear/Actualizar Horario</span>
                        </button>
                        <a th:href="@{/admin/schedules}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
