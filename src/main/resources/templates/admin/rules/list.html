<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Reglas de Seguimiento de Tiempo</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Reglas de Seguimiento de Tiempo</h1>
            
            <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">Lista de Reglas</h6>
                    <a th:href="@{/admin/rules/new}" class="btn btn-success btn-sm">
                        <i class="fas fa-plus"></i> Nueva Regla
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Ubicación Requerida</th>
                                    <th>Entrada Manual</th>
                                    <th>Minutos de Tolerancia</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="rule : ${rules}">
                                    <td th:text="${rule.name}">Nombre de la Regla</td>
                                    <td>
                                        <span th:if="${rule.requireLocation}" class="badge badge-success">Sí</span>
                                        <span th:unless="${rule.requireLocation}" class="badge badge-secondary">No</span>
                                    </td>
                                    <td>
                                        <span th:if="${rule.allowManualEntry}" class="badge badge-success">Permitida</span>
                                        <span th:unless="${rule.allowManualEntry}" class="badge badge-secondary">No Permitida</span>
                                    </td>
                                    <td th:text="${rule.maxLateMinutes}">Minutos de Tolerancia</td>
                                    <td>
                                        <a th:href="@{/admin/rules/{id}/edit(id=${rule.id})}" 
                                           class="btn btn-primary btn-sm">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{/admin/rules/{id}(id=${rule.id})}" 
                                              method="post" 
                                              style="display: inline;"
                                              th:data-confirm="'¿Está seguro de eliminar esta regla?'"
                                              class="delete-form">
                                            <input type="hidden" name="_method" value="DELETE"/>
                                            <button type="submit" class="btn btn-danger btn-sm">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
