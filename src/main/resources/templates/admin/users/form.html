<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="${user.id == null ? 'Nuevo Usuario' : 'Editar Usuario'}">Gestión de Usuario</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800" th:text="${user.id == null ? 'Nuevo Usuario' : 'Editar Usuario'}">Gestión de Usuario</h1>

            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary" th:text="${user.id == null ? 'Crear Usuario' : 'Modificar Usuario'}">Formulario de Usuario</h6>
                </div>
                <div class="card-body">
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">
                        Error message
                    </div>

                    <form th:action="${user.id == null ? '/admin/users/new' : '/admin/users/' + user.id}" 
                          th:object="${user}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="username" th:field="*{username}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="employeeId" class="form-label">Documento de Identificación</label>
                            <input type="text" class="form-control" id="employeeId" th:field="*{nif}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('nif')}" th:errors="*{nif}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" 
                                   th:required="${user.id == null}">
                            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            <small class="form-text text-muted" th:if="${user.id != null}">
                                Dejar en blanco para mantener la contraseña actual
                            </small>
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label">Rol</label>
                            <select class="form-select" id="role" th:field="*{role}" required>
                                <option th:each="availableRole : ${roles}"
                                        th:value="${availableRole}"
                                        th:text="${availableRole}"
                                        th:if="${availableRole != 'EMPLOYEE'}">ROLE</option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="dataConsent" th:field="*{dataConsent}" required>
                                <label class="form-check-label" for="dataConsent">
                                    Acepto el tratamiento de mis datos personales
                                </label>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('dataConsent')}" th:errors="*{dataConsent}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/users}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 
                                <span th:text="${user.id == null ? 'Crear' : 'Actualizar'}">Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
