<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title>Gestión de Incidencias</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Gestión de Incidencias</h1>

            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Lista de Incidencias</h6>
                    <a th:href="@{/admin/incidents/new}" class="btn btn-primary float-right">Nueva Incidencia</a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered" id="dataTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Usuario</th>
                                    <th>Tipo</th>
                                    <th>Descripción</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="incident : ${incidents}">
                                    <td th:text="${incident.id}"></td>
                                    <td th:text="${incident.user.name}"></td>
                                    <td th:text="${incident.type}"></td>
                                    <td th:text="${incident.description}"></td>
                                    <td th:text="${incident.status}"></td>
                                    <td th:text="${#temporals.format(incident.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{/admin/incidents/{id}/edit(id=${incident.id})}" 
                                               class="btn btn-primary btn-sm">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <form th:if="${incident.status == T(com.iaenjoyer.employeetimetracker.model.Incident.IncidentStatus).PENDING}"
                                                  th:action="@{/admin/incidents/{id}/approve(id=${incident.id})}" 
                                                  method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-success btn-sm">
                                                    <i class="fas fa-check"></i>
                                                </button>
                                            </form>
                                            <button th:if="${incident.status == T(com.iaenjoyer.employeetimetracker.model.Incident.IncidentStatus).PENDING}"
                                                    type="button" 
                                                    class="btn btn-danger btn-sm"
                                                    th:data-incident-id="${incident.id}"
                                                    onclick="showRejectModal(this.getAttribute('data-incident-id'))">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal de Rechazo -->
        <div class="modal fade" id="rejectModal" tabindex="-1" role="dialog">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Rechazar Incidencia</h5>
                        <button type="button" class="close" data-dismiss="modal">
                            <span>&times;</span>
                        </button>
                    </div>
                    <form id="rejectForm" method="post">
                        <div class="modal-body">
                            <div class="form-group">
                                <label for="reason">Motivo del Rechazo</label>
                                <textarea class="form-control" id="reason" name="reason" required></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-danger">Rechazar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            function showRejectModal(incidentId) {
                const modal = $('#rejectModal');
                const form = $('#rejectForm');
                form.attr('action', `/admin/incidents/${incidentId}/reject`);
                modal.modal('show');
            }

            $(document).ready(function() {
                $('#dataTable').DataTable();
            });
        </script>
    </th:block>
</body>
</html>
