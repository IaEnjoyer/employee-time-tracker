<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="${employee.id == null ? 'Nuevo Empleado' : 'Editar Empleado'}">Gestión de Empleado</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800" th:text="${employee.id == null ? 'Nuevo Empleado' : 'Editar Empleado'}">Gestión de Empleado</h1>

            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary" th:text="${employee.id == null ? 'Crear Empleado' : 'Modificar Empleado'}">Formulario de Empleado</h6>
                </div>
                <div class="card-body">
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">
                        Error message
                    </div>

                    <form th:action="${employee.id == null ? '/supervisor/employees/new' : '/supervisor/employees/' + employee.id}" 
                          th:object="${employee}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="username" th:field="*{username}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" 
                                   th:required="${employee.id == null}">
                            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            <small class="form-text text-muted" th:if="${employee.id != null}">
                                Dejar en blanco para mantener la contraseña actual
                            </small>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label">Departamento</label>
                            <input type="text" class="form-control" id="department" th:field="*{department}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="employeeId" class="form-label">ID de Empleado</label>
                            <input type="text" class="form-control" id="employeeId" th:field="*{employeeId}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="position" class="form-label">Puesto</label>
                            <input type="text" class="form-control" id="position" th:field="*{position}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="skills" class="form-label">Habilidades</label>
                            <textarea class="form-control" id="skills" th:field="*{skills}" rows="3"></textarea>
                            <div class="text-danger" th:if="${#fields.hasErrors('skills')}" th:errors="*{skills}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="certifications" class="form-label">Certificaciones</label>
                            <textarea class="form-control" id="certifications" th:field="*{certifications}" rows="3"></textarea>
                            <div class="text-danger" th:if="${#fields.hasErrors('certifications')}" th:errors="*{certifications}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="emergencyContact" class="form-label">Contacto de Emergencia</label>
                            <input type="text" class="form-control" id="emergencyContact" th:field="*{emergencyContact}">
                            <div class="text-danger" th:if="${#fields.hasErrors('emergencyContact')}" th:errors="*{emergencyContact}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="schedule" class="form-label">Horario</label>
                            <select class="form-select" id="schedule" th:field="*{schedule}" required>
                                <option value="">Seleccionar horario</option>
                                <option th:each="schedule : ${schedules}"
                                        th:value="${schedule.id}"
                                        th:text="${schedule.name}">Horario</option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('schedule')}" th:errors="*{schedule}"></div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="dataConsent" th:field="*{dataConsent}" required>
                                <label class="form-check-label" for="dataConsent">
                                    Acepto el tratamiento de mis datos personales
                                </label>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('dataConsent')}" th:errors="*{dataConsent}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/supervisor/employees}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 
                                <span th:text="${employee.id == null ? 'Crear' : 'Actualizar'}">Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
