<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Employee Time Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Arial', sans-serif;
        }
        .clock {
            font-size: 2.5rem;
            font-weight: bold;
            color: #0d6efd;
            background-color: #e9ecef;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .status-card {
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: none;
        }
        .status-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .navbar {
            background: linear-gradient(to right, #0d6efd, #4a90e2);
        }
        .card-title {
            color: #2c3e50;
            font-weight: 600;
            border-bottom: 2px solid #0d6efd;
            padding-bottom: 10px;
        }
        .btn-quick-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-quick-action:hover {
            transform: scale(1.05);
        }
        .btn-quick-action i {
            font-size: 1.2rem;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#" th:text="${companyName}">Company Name</a>
            <div class="navbar-nav ms-auto">
                <span class="nav-link text-white" th:text="${user.name}">User Name</span>
                <form th:action="@{/logout}" method="post" class="d-flex">
                    <button class="btn btn-link nav-link text-white" type="submit">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <h1 class="display-5 mb-3">Bienvenido, <span th:text="${user.name}" class="text-primary">User</span></h1>
                <p class="lead text-muted">Gestiona tu tiempo de trabajo de manera eficiente</p>
            </div>
            <div class="col-md-6 text-end">
                <div class="clock" id="clock" th:text="${currentTime}">00:00:00</div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-12">
                <div class="card status-card">
                    <div class="card-body">
                        <h5 class="card-title">Registro de Tiempo</h5>
                        <div th:if="${activeRecord == null}" class="text-center py-4">
                            <p class="mb-4 text-muted">No has registrado entrada hoy</p>
                            <form th:action="@{/employee/timerecord/checkin}" method="post">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-clock"></i> Registrar Entrada
                                </button>
                            </form>
                        </div>
                        <div th:if="${activeRecord != null}" class="text-center py-4">
                            <p class="mb-4">
                                Entrada registrada: 
                                <span class="badge bg-success" th:text="${#temporals.format(activeRecord.startTime, 'HH:mm:ss')}">09:00</span>
                            </p>
                            <form th:action="@{/employee/timerecord/checkout}" method="post">
                                <button type="submit" class="btn btn-danger btn-lg">
                                    <i class="fas fa-clock"></i> Registrar Salida
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Acciones Rápidas</h5>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <a th:href="@{/employee/timerecord/history}" class="btn btn-outline-secondary btn-quick-action w-100">
                                    <i class="fas fa-history"></i> Historial de Registros
                                </a>
                            </div>
                            <div class="col-md-4">
                                <a th:href="@{/employee/timerecord/report}" class="btn btn-outline-info btn-quick-action w-100">
                                    <i class="fas fa-file-alt"></i> Generar Informe Personal
                                </a>
                            </div>
                            <div class="col-md-4">
                                <a href="#" class="btn btn-outline-primary btn-quick-action w-100" data-bs-toggle="modal" data-bs-target="#leaveRequestModal">
                                    <i class="fas fa-calendar-check"></i> Solicitar Permiso
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leave Request Modal -->
    <div class="modal fade" id="leaveRequestModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Solicitar Permiso</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/employee/timerecord/leave-request}" method="post">
                        <div class="mb-3">
                            <label for="leaveType" class="form-label">Tipo de Permiso</label>
                            <select class="form-select" id="leaveType" name="leaveType" required>
                                <option value="">Seleccionar tipo de permiso</option>
                                <option value="VACATION">Vacaciones</option>
                                <option value="SICK_LEAVE">Baja Médica</option>
                                <option value="PERSONAL">Asuntos Personales</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="startDate" class="form-label">Fecha de Inicio</label>
                            <input type="date" class="form-control" id="startDate" name="startDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="endDate" class="form-label">Fecha de Fin</label>
                            <input type="date" class="form-control" id="endDate" name="endDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="reason" class="form-label">Razón</label>
                            <textarea class="form-control" id="reason" name="reason" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function updateClock() {
            const clock = document.getElementById('clock');
            const now = new Date();
            const time = now.toLocaleTimeString('es-ES');
            clock.textContent = time;
        }
        
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
