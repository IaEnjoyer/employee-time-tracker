<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Employee Time Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .clock {
            font-size: 2.5rem;
            font-weight: bold;
            color: #0d6efd;
        }
        .status-card {
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .status-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#" th:text="${companyName}">Company Name</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link" th:text="${user.name}">User Name</span>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post">
                            <button class="btn btn-link nav-link" type="submit">
                                <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-md-6">
                <h1 class="mb-4">Bienvenido, <span th:text="${user.name}">User</span></h1>
            </div>
            <div class="col-md-6 text-end">
                <div class="clock" id="clock" th:text="${currentTime}">00:00:00</div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card status-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Estado Actual</h5>
                        <div th:if="${activeRecord == null}" class="text-center py-4">
                            <p class="mb-4">No has registrado entrada hoy</p>
                            <form th:action="@{/timerecord/checkin}" method="post">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-clock"></i> Registrar Entrada
                                </button>
                            </form>
                        </div>
                        <div th:if="${activeRecord != null}" class="text-center py-4">
                            <p class="mb-4">
                                Entrada registrada: 
                                <span th:text="${#temporals.format(activeRecord.startTime, 'HH:mm:ss')}">09:00</span>
                            </p>
                            <form th:action="@{/timerecord/checkout}" method="post">
                                <button type="submit" class="btn btn-danger btn-lg">
                                    <i class="fas fa-clock"></i> Registrar Salida
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card status-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Estado Personal</h5>
                        <div class="row text-center g-3">
                            <div class="col-6">
                                <div class="p-3 bg-light rounded">
                                    <i class="fas fa-plane fa-2x text-primary mb-2"></i>
                                    <p class="mb-0">Vacaciones</p>
                                    <p class="mb-0" th:text="${user.onVacation ? 'Sí' : 'No'}">No</p>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-3 bg-light rounded">
                                    <i class="fas fa-hospital fa-2x text-danger mb-2"></i>
                                    <p class="mb-0">Baja Médica</p>
                                    <p class="mb-0" th:text="${user.onSickLeave ? 'Sí' : 'No'}">No</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateClock() {
            const clock = document.getElementById('clock');
            const now = new Date();
            const time = now.toLocaleTimeString('es-ES');
            clock.textContent = time;
        }
        
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
