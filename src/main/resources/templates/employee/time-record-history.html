<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
    <title>Historial de Registros de Tiempo</title>
</head>
<body>
    <div layout:fragment="content" class="container mt-4">
        <h2>Historial de Registros de Tiempo</h2>
        
        <!-- Date Range Filter Form -->
        <form th:action="@{/employee/timerecord/history}" method="get" class="mb-4">
            <div class="row">
                <div class="col-md-5">
                    <label for="start" class="form-label">Fecha de Inicio</label>
                    <input type="datetime-local" id="start" name="start" 
                           class="form-control" 
                           th:value="${#temporals.format(startDate, 'yyyy-MM-dd HH:mm')}">
                </div>
                <div class="col-md-5">
                    <label for="end" class="form-label">Fecha de Fin</label>
                    <input type="datetime-local" id="end" name="end" 
                           class="form-control" 
                           th:value="${#temporals.format(endDate, 'yyyy-MM-dd HH:mm')}">
                </div>
                <div class="col-md-2 align-self-end">
                    <button type="submit" class="btn btn-primary">Filtrar</button>
                </div>
            </div>
        </form>

        <!-- Time Records Table -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Fecha de Inicio</th>
                        <th>Fecha de Fin</th>
                        <th>Horas</th>
                        <th>Estado</th>
                        <th>Notas</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="record : ${timeRecords}">
                        <td th:text="${#temporals.format(record.startTime, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${record.endTime != null ? #temporals.format(record.endTime, 'dd/MM/yyyy HH:mm') : 'En curso'}"></td>
                        <td th:text="${#numbers.formatDecimal(record.hours, 1, 2)}"></td>
                        <td>
                            <span th:class="${record.status == 'PENDING' ? 'badge bg-warning' : (record.status == 'APPROVED' ? 'badge bg-success' : 'badge bg-danger')}"
                                  th:text="${record.status == 'PENDING' ? 'Pendiente' : (record.status == 'APPROVED' ? 'Aprobado' : 'Rechazado')}">
                            </span>
                        </td>
                        <td th:text="${record.notes ?: 'Sin notas'}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Summary Section -->
        <div class="card mt-3">
            <div class="card-body">
                <h5 class="card-title">Resumen</h5>
                <p>Total de Registros: <span th:text="${timeRecords.size()}"></span></p>
                <p>Total de Horas: 
                    <span th:text="${#numbers.formatDecimal(#aggregates.sum(timeRecords.![hours]), 1, 2)}"></span>
                </p>
                <a th:href="@{/employee/timerecord/report(start=${#temporals.format(startDate, 'yyyy-MM-dd HH:mm')}, end=${#temporals.format(endDate, 'yyyy-MM-dd HH:mm')})}" 
                   class="btn btn-secondary mt-2" target="_blank">
                    <i class="bi bi-file-pdf"></i> Descargar Reporte PDF
                </a>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                // Optional: Add any client-side interactions or validations
            });
        </script>
    </th:block>
</body>
</html>
