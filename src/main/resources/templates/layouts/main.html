<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Sistema de Fichajes">Sistema de Fichajes</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Sistema de Fichajes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item" sec:authorize="hasRole('SUPERVISOR')">
                        <a class="nav-link" href="/supervisor/time-records">Aprobar Registros</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" href="/admin/users">Usuarios</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" href="/admin/reports">Informes</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" 
                           data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i>
                            <span sec:authentication="name"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="dropdown-item p-0">
                                    <button type="submit" class="btn btn-link text-decoration-none w-100 text-start px-3">
                                        Cerrar Sesión
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div layout:fragment="content">
            <!-- Page content goes here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">© 2025 Sistema de Fichajes. Todos los derechos reservados.</span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                const generateBtn = document.getElementById('generateBtn');
                const downloadPdfBtn = document.getElementById('downloadPdfBtn');
                const downloadExcelBtn = document.getElementById('downloadExcelBtn');
                const reportForm = document.getElementById('reportForm');
                const errorContainer = document.getElementById('errorContainer');

                // Función para mostrar mensajes de error
                function showError(message) {
                    errorContainer.textContent = message;
                    errorContainer.style.display = 'block';
                }

                // Función para ocultar mensajes de error
                function hideError() {
                    errorContainer.style.display = 'none';
                }

                // Función para formatear fechas
                function toBackendDateFormat(dateString) {
                    if (!dateString) {
                        console.error("Fecha vacía recibida");
                        return '';
                    }

                    try {
                        const date = new Date(dateString);
                        const year = date.getFullYear();
                        const month = ('0' + (date.getMonth() + 1)).slice(-2);
                        const day = ('0' + date.getDate()).slice(-2);
                        const hours = ('0' + date.getHours()).slice(-2);
                        const minutes = ('0' + date.getMinutes()).slice(-2);

                        return `${year}-${month}-${day}T${hours}:${minutes}:00`;
                    } catch (e) {
                        console.error("Error formateando fecha:", e);
                        return '';
                    }
                }

                // Función para construir URL con parámetros
                function buildUrl(basePath, action, params) {
                    const url = new URL(`${window.location.origin}${basePath}/${action}`);

                    Object.keys(params).forEach(key => {
                        if (params[key]) {
                            url.searchParams.append(key, params[key]);
                        }
                    });

                    console.log("URL construida:", url.toString());
                    return url.toString();
                }

                // Función para descargar archivos
                async function downloadFile(format) {
                    const start = document.getElementById('start').value;
                    const end = document.getElementById('end').value;
                    const params = { start: toBackendDateFormat(start), end: toBackendDateFormat(end) };

                    try {
                        const response = await fetch(buildUrl('/admin/reports', `export/${format}`, params));
                        if (response.ok) {
                            const blob = await response.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `reporte_general.${format}`;
                            a.click();
                            window.URL.revokeObjectURL(url);
                        } else {
                            const error = await response.text();
                            showError(`Error: ${error}`);
                        }
                    } catch (error) {
                        console.error("Error al descargar el archivo:", error);
                        showError("Ocurrió un error al descargar el archivo");
                    }
                }

                // Manejador de eventos para el botón "Descargar PDF"
                downloadPdfBtn.addEventListener('click', () => downloadFile('pdf'));

                // Manejador de eventos para el botón "Descargar Excel"
                downloadExcelBtn.addEventListener('click', () => downloadFile('excel'));
            });
        </script>
    </th:block>
</body>
</html>
