# Configuración de la base de datos PostgreSQL para Railway
spring.datasource.url=jdbc:postgresql://trolley.proxy.rlwy.net:18272/railway
spring.datasource.username=postgres
spring.datasource.password=pwRTkhpHlzOzngyAkoLymNfGuygEWnXL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración de seguridad
spring.security.user.name=admin
spring.security.user.password=admin123

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.enabled=true

# Configuración del servidor
server.port=${PORT:8081}

# Configuración de la zona horaria
spring.jackson.time-zone=Europe/Madrid

# Configuración de logging
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.com.iaenjoyer=DEBUG
logging.level.org.springframework.web.servlet.mvc=TRACE

# Habilitar filtro de métodos ocultos para DELETE, PUT, etc.
spring.mvc.hiddenmethod.filter.enabled=true
