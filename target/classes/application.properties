# Configuración de la base de datos
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:employeedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración de H2 (para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de seguridad
spring.security.user.name=admin
spring.security.user.password=admin123

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.enabled=true

# Configuración del servidor
server.port=${PORT:8081}

# Configuración de la zona horaria
spring.jackson.time-zone=Europe/Madrid

# Configuración de logging
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.iaenjoyer=ERROR

# Habilitar filtro de métodos ocultos para DELETE, PUT, etc.
spring.mvc.hiddenmethod.filter.enabled=true
