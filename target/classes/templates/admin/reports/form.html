<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Generación de Reportes</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Generación de Reportes</h1>
            
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Parámetros del Reporte</h6>
                </div>
                <div class="card-body">
                    <form id="reportForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="type">Tipo de Reporte</label>
                                    <select class="form-control" id="type" name="type" required>
                                        <option value="">Seleccione un tipo</option>
                                        <option value="general">Reporte General</option>
                                        <option value="department">Reporte por Departamento</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6" id="departmentGroup" style="display: none;">
                                <div class="form-group">
                                    <label for="department">Departamento</label>
                                    <select class="form-control" id="department" name="department">
                                        <option value="">Seleccione un departamento</option>
                                        <option th:each="dept : ${departments}"
                                                th:value="${dept}"
                                                th:text="${dept}">Departamento</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="start">Fecha Inicio</label>
                                    <input type="datetime-local" class="form-control" id="start" name="start" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="end">Fecha Fin</label>
                                    <input type="datetime-local" class="form-control" id="end" name="end" required>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-4">
                            <div class="col-12">
                                <button type="button" class="btn btn-primary mr-2" id="generateBtn">
                                    <i class="fas fa-eye"></i> Vista Previa
                                </button>
                                <button type="button" class="btn btn-success mr-2" id="downloadPdfBtn">
                                    <i class="fas fa-file-pdf"></i> Descargar PDF
                                </button>
                                <button type="button" class="btn btn-success" id="downloadExcelBtn">
                                    <i class="fas fa-file-excel"></i> Descargar Excel
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Preview Card -->
            <div id="previewCard" class="card shadow mb-4" style="display: none;">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Vista Previa del Reporte</h6>
                </div>
                <div class="card-body" id="previewContent">
                    <!-- Content will be dynamically populated -->
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const typeSelect = document.getElementById('type');
                const departmentGroup = document.getElementById('departmentGroup');
                const generateBtn = document.getElementById('generateBtn');
                const downloadPdfBtn = document.getElementById('downloadPdfBtn');
                const downloadExcelBtn = document.getElementById('downloadExcelBtn');
                const previewCard = document.getElementById('previewCard');
                const previewContent = document.getElementById('previewContent');

                typeSelect.addEventListener('change', function() {
                    departmentGroup.style.display = this.value === 'department' ? 'block' : 'none';
                });

                function getFormData() {
                    const type = typeSelect.value;
                    const department = document.getElementById('department').value;
                    const start = document.getElementById('start').value;
                    const end = document.getElementById('end').value;

                    if (!type || !start || !end) {
                        alert('Por favor complete todos los campos requeridos');
                        return null;
                    }

                    if (type === 'department' && !department) {
                        alert('Por favor seleccione un departamento');
                        return null;
                    }

                    return { type, department, start, end };
                }

                generateBtn.addEventListener('click', function() {
                    const data = getFormData();
                    if (!data) return;

                    const params = new URLSearchParams(data);
                    fetch(`/admin/reports/generate?${params}`)
                        .then(response => response.json())
                        .then(data => {
                            previewCard.style.display = 'block';
                            previewContent.innerHTML = formatPreviewData(data);
                        })
                        .catch(error => {
                            alert('Error al generar la vista previa');
                            console.error('Error:', error);
                        });
                });

                downloadPdfBtn.addEventListener('click', function() {
                    const data = getFormData();
                    if (!data) return;

                    const params = new URLSearchParams(data);
                    window.location.href = `/admin/reports/export/pdf?${params}`;
                });

                downloadExcelBtn.addEventListener('click', function() {
                    const data = getFormData();
                    if (!data) return;

                    const params = new URLSearchParams(data);
                    window.location.href = `/admin/reports/export/excel?${params}`;
                });

                function formatPreviewData(data) {
                    // Format the preview data based on the response structure
                    let html = '<div class="table-responsive">';
                    html += '<table class="table table-bordered">';
                    // Add table headers and rows based on data structure
                    html += '</table></div>';
                    return html;
                }
            });
        </script>
    </th:block>
</body>
</html>
