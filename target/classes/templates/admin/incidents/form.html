<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="${incident.id} ? 'Editar Incidencia' : 'Nueva Incidencia'"></title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800" th:text="${incident.id} ? 'Editar Incidencia' : 'Nueva Incidencia'"></h1>

            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Detalles de la Incidencia</h6>
                </div>
                <div class="card-body">
                    <form th:action="${incident.id} ? @{/admin/incidents/{id}(id=${incident.id})} : @{/admin/incidents/new}"
                          th:object="${incident}" method="post">
                        
                        <div class="form-group">
                            <label for="user">Usuario</label>
                            <select class="form-control" id="user" th:field="*{user}" required>
                                <option value="">Seleccione un usuario</option>
                                <option th:each="user : ${users}"
                                        th:value="${user.id}"
                                        th:text="${user.name}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="type">Tipo de Incidencia</label>
                            <select class="form-control" id="type" th:field="*{type}" required>
                                <option value="">Seleccione un tipo</option>
                                <option th:each="type : ${T(com.iaenjoyer.employeetimetracker.model.Incident.IncidentType).values()}"
                                        th:value="${type}"
                                        th:text="${type}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="description">Descripción</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="3" required></textarea>
                        </div>

                        <div class="form-group">
                            <a th:href="@{/admin/incidents}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
