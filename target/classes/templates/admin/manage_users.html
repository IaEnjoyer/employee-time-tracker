<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head>
    <title>Gestionar Empleados - Control Horario</title>
</head>
<body>
    <div layout:fragment="content" class="container">
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0 d-flex align-items-center">
                            <i class="fas fa-users me-2"></i>
                            Gestionar Empleados
                        </h2>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Usuario</th>
                                        <th>Nombre</th>
                                        <th>Email</th>
                                        <th>Rol</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <i class="fas fa-user-circle text-primary me-2"></i>
                                                <span th:text="${user.username}"></span>
                                            </div>
                                        </td>
                                        <td th:text="${user.name}"></td>
                                        <td>
                                            <a th:href="'mailto:' + ${user.email}" class="text-decoration-none">
                                                <i class="fas fa-envelope text-muted me-1"></i>
                                                <span th:text="${user.email}"></span>
                                            </a>
                                        </td>
                                        <td>
                                            <span th:class="'badge ' + (${user.role == 'ROLE_ADMIN'} ? 'bg-primary' : 'bg-info')"
                                                  th:text="${#strings.toLowerCase(#strings.replace(user.role, 'ROLE_', ''))}">
                                            </span>
                                        </td>
                                        <td>
                                            <div class="btn-group" th:if="${user.role != 'ROLE_ADMIN'}">
                                                <button class="btn btn-sm btn-outline-primary" 
                                                        th:onclick="'editUser(\'' + ${user.id} + '\')'"
                                                        title="Editar usuario">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <button class="btn btn-sm btn-outline-danger" 
                                                        th:onclick="'confirmDelete(\'' + ${user.id} + '\', \'' + ${user.name} + '\')'"
                                                        title="Eliminar usuario">
                                                    <i class="fas fa-trash-alt"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(users)}">
                                        <td colspan="5" class="text-center text-muted py-4">
                                            <i class="fas fa-users fa-2x mb-2"></i>
                                            <p>No hay empleados registrados</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0 d-flex align-items-center">
                            <i class="fas fa-user-plus me-2"></i>
                            Nuevo Empleado
                        </h3>
                    </div>
                    <div class="card-body">
                        <a th:href="@{/admin/users/new}" class="btn btn-primary w-100">
                            <i class="fas fa-plus me-2"></i>
                            Crear Empleado
                        </a>
                    </div>
                </div>

                <!-- Estadísticas -->
                <div class="card shadow mt-4">
                    <div class="card-header bg-info text-white">
                        <h3 class="mb-0 d-flex align-items-center">
                            <i class="fas fa-chart-pie me-2"></i>
                            Estadísticas
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="list-group list-group-flush">
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                Total Empleados
                                <span class="badge bg-primary rounded-pill" th:text="${#lists.size(users)}"></span>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                Administradores
                                <span class="badge bg-info rounded-pill" 
                                      th:text="${#lists.size(users.?[role == 'ROLE_ADMIN'])}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal de confirmación de eliminación -->
        <div class="modal fade" id="deleteModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Confirmar Eliminación
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="mb-2">¿Estás seguro de que deseas eliminar al empleado <span id="userName" class="fw-bold"></span>?</p>
                        <div class="alert alert-warning">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            Esta acción no se puede deshacer.
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fas fa-times me-2"></i>Cancelar
                        </button>
                        <form id="deleteForm" th:action="@{/admin/delete-user}" method="POST" style="display: inline;">
                            <input type="hidden" name="userId" id="userId">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash-alt me-2"></i>Eliminar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts específicos de la página -->
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            function confirmDelete(userId, userName) {
                document.getElementById('userId').value = userId;
                document.getElementById('userName').textContent = userName;
                new bootstrap.Modal(document.getElementById('deleteModal')).show();
            }

            function editUser(userId) {
                window.location.href = /*[[@{/admin/users/edit/}]]*/ '' + userId;
            }

            // Auto-cerrar alertas después de 5 segundos
            setTimeout(function() {
                document.querySelectorAll('.alert').forEach(function(alert) {
                    new bootstrap.Alert(alert).close();
                });
            }, 5000);
        </script>
    </th:block>
</body>
</html>
