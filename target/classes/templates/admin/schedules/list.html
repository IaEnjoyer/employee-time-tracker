<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Gestión de Horarios</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Gestión de Horarios</h1>
            
            <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">Lista de Horarios</h6>
                    <a th:href="@{/admin/schedules/new}" class="btn btn-success btn-sm">
                        <i class="fas fa-plus"></i> Nuevo Horario
                    </a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Departamento</th>
                                    <th>Tipo</th>
                                    <th>Hora Entrada</th>
                                    <th>Hora Salida</th>
                                    <th>Días</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="schedule : ${schedules}">
                                    <td th:text="${schedule.name}">Nombre</td>
                                    <td th:text="${schedule.department}">Departamento</td>
                                    <td th:text="${schedule.type}">Tipo</td>
                                    <td th:text="${#temporals.format(schedule.startTime, 'HH:mm')}">09:00</td>
                                    <td th:text="${#temporals.format(schedule.endTime, 'HH:mm')}">18:00</td>
                                    <td>
                                        <span th:if="${schedule.monday}" class="badge badge-primary mr-1">L</span>
                                        <span th:if="${schedule.tuesday}" class="badge badge-primary mr-1">M</span>
                                        <span th:if="${schedule.wednesday}" class="badge badge-primary mr-1">X</span>
                                        <span th:if="${schedule.thursday}" class="badge badge-primary mr-1">J</span>
                                        <span th:if="${schedule.friday}" class="badge badge-primary mr-1">V</span>
                                        <span th:if="${schedule.saturday}" class="badge badge-primary mr-1">S</span>
                                        <span th:if="${schedule.sunday}" class="badge badge-primary mr-1">D</span>
                                    </td>
                                    <td>
                                        <span th:if="${schedule.active}" class="badge badge-success">Activo</span>
                                        <span th:unless="${schedule.active}" class="badge badge-secondary">Inactivo</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/schedules/{id}/edit(id=${schedule.id})}" 
                                           class="btn btn-primary btn-sm">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{/admin/schedules/{id}(id=${schedule.id})}" 
                                              method="post" 
                                              style="display: inline;"
                                              th:data-confirm="'¿Está seguro de eliminar el horario?'"
                                              class="delete-form">
                                            <input type="hidden" name="_method" value="DELETE"/>
                                            <button type="submit" class="btn btn-danger btn-sm">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete confirmation script -->
    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                document.querySelectorAll('.delete-form').forEach(form => {
                    form.addEventListener('submit', function(e) {
                        e.preventDefault();
                        if (confirm(this.dataset.confirm)) {
                            this.submit();
                        }
                    });
                });
            });
        </script>
    </th:block>
</body>
</html>
