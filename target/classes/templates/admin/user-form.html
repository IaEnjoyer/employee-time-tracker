<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary bg-gradient text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-user-plus me-2"></i>
                            <span th:text="${user.id != null} ? 'Editar Usuario' : 'Nuevo Usuario'">Nuevo Usuario</span>
                        </h5>
                        <a th:href="@{/admin/dashboard}" class="btn btn-light btn-sm">
                            <i class="fas fa-arrow-left me-1"></i>
                            Volver
                        </a>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/users}" th:object="${user}" method="POST" class="needs-validation" novalidate>
                            <input type="hidden" th:field="*{id}" th:if="${user.id != null}">
                            
                            <div class="row g-3">
                                <!-- Nombre -->
                                <div class="col-md-6">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" class="form-control" th:field="*{name}" required>
                                    <div class="invalid-feedback">El nombre es requerido</div>
                                </div>
                                
                                <!-- Email -->
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}" required>
                                    <div class="invalid-feedback">Email válido es requerido</div>
                                </div>
                                
                                <!-- Usuario -->
                                <div class="col-md-6">
                                    <label class="form-label">Usuario</label>
                                    <input type="text" class="form-control" th:field="*{username}" required>
                                    <div class="invalid-feedback">El usuario es requerido</div>
                                </div>
                                
                                <!-- Contraseña -->
                                <div class="col-md-6">
                                    <label class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" th:field="*{password}" 
                                           th:required="${user.id == null}">
                                    <div class="form-text" th:if="${user.id != null}">
                                        Dejar en blanco para mantener la contraseña actual
                                    </div>
                                </div>
                                
                                <!-- Rol -->
                                <div class="col-md-6">
                                    <label class="form-label">Rol</label>
                                    <select class="form-select" th:field="*{role}" required>
                                        <option value="">Seleccionar rol...</option>
                                        <option value="ROLE_USER">Usuario</option>
                                        <option value="ROLE_ADMIN">Administrador</option>
                                    </select>
                                    <div class="invalid-feedback">Por favor seleccione un rol</div>
                                </div>
                                
                                <!-- Retención de datos -->
                                <div class="col-md-6">
                                    <label class="form-label">Retención de datos (días)</label>
                                    <input type="number" class="form-control" th:field="*{dataRetentionDays}" 
                                           min="30" max="3650" required>
                                    <div class="invalid-feedback">
                                        Por favor ingrese un valor entre 30 y 3650 días
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Consentimiento de datos -->
                            <div class="form-check mt-3">
                                <input type="checkbox" class="form-check-input" th:field="*{dataConsent}" required>
                                <label class="form-check-label">
                                    Acepto el procesamiento y almacenamiento de mis datos
                                </label>
                                <div class="invalid-feedback">
                                    Debe aceptar el procesamiento de datos
                                </div>
                            </div>
                            
                            <!-- Botones -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a th:href="@{/admin/dashboard}" class="btn btn-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>
                                    <span th:text="${user.id != null} ? 'Guardar Cambios' : 'Crear Usuario'">
                                        Crear Usuario
                                    </span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script para validación del formulario -->
    <th:block layout:fragment="scripts">
        <script>
            (function () {
                'use strict'
                var forms = document.querySelectorAll('.needs-validation')
                Array.prototype.slice.call(forms)
                    .forEach(function (form) {
                        form.addEventListener('submit', function (event) {
                            if (!form.checkValidity()) {
                                event.preventDefault()
                                event.stopPropagation()
                            }
                            form.classList.add('was-validated')
                        }, false)
                    })
            })()
        </script>
    </th:block>
</body>
</html>
